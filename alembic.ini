# Alembic configuration for CloudNotes.
#
# No database credentials live here (rule: never hardcode secrets). The
# database URL is resolved in migrations/env.py from application settings
# (CLOUDNOTES_DATABASE_URL) — sync driver variant for migrations.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Timestamped revision files sort chronologically.
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.args = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
