[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudnotes"
version = "0.1.0"
description = "Production-ready REST API for note management."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reda El Hajjaji" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
]

[project.urls]
Homepage = "https://github.com/RedaElHajjaji/Cloudnotes"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "T20", "TRY", "EM", "FURB", "RUF"]
ignore = [
    "EM101",  # allow string literals in raised exceptions for clarity
    "EM102",
    "TRY003", # long messages in raised API errors are fine
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "db: integration tests that require a real PostgreSQL (set CLOUDNOTES_TEST_DATABASE_URL)",
]
